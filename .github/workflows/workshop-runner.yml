name: Workshop runner offline checks

on:
  push:
    paths:
      - "workshop/runner/**"
      - ".github/workflows/workshop-runner.yml"
  pull_request:
    paths:
      - "workshop/runner/**"
      - ".github/workflows/workshop-runner.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test without Azure credentials or SDK installation
        run: python -S -m unittest discover -s workshop/runner -p "test_*.py" -v
